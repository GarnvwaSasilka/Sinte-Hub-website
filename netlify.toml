# Netlify settings. This is the ONLY Netlify-specific file in the project.
# To move to another host later, you can delete it; nothing else changes.
# Netlify detects Next.js and adds its Next.js runtime automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Keep build logs readable
  NEXT_TELEMETRY_DISABLED = "1"
